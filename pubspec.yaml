name: wallet_manager
description: "Application for helping on saving, track and manage your money either cash or visa."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1  # For fonts
  provider: ^6.1.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  share_plus: ^10.0.2
  flutter_launcher_icons: ^0.13.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E3A8A"
  remove_alpha_ios: true